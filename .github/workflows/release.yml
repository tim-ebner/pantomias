name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version as X.Y.Z+B (leave empty to auto-bump patch)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Compute release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compute version
        id: version
        run: |
          NEW_VERSION=$(dart run tool/bump_version.dart "${{ inputs.version }}")
          {
            echo "version=$NEW_VERSION"
            echo "build_name=${NEW_VERSION%+*}"
            echo "build_number=${NEW_VERSION#*+}"
          } >> "$GITHUB_OUTPUT"

  release_android:
    name: Release Android (Play Store internal track)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/app/release.jks"

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$GITHUB_WORKSPACE/android/app/release.jks
          EOF

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.prepare.outputs.build_name }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: org.ebner.pantomias
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties

  release_ios:
    name: Release iOS (TestFlight)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        id: profile
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | python3 -c "import sys, plistlib; print(plistlib.loads(sys.stdin.buffer.read())['Name'])")
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Render ExportOptions.plist
        run: |
          python3 - "${{ steps.profile.outputs.name }}" <<'EOF'
          import sys
          name = sys.argv[1]
          with open("ios/ExportOptions.plist.template") as f:
              content = f.read()
          content = content.replace("__PROVISIONING_PROFILE_NAME__", name)
          with open("ios/ExportOptions.plist", "w") as f:
              f.write(content)
          EOF

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-name=${{ needs.prepare.outputs.build_name }} \
            --build-number=${{ needs.prepare.outputs.build_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ios

      - name: Upload to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA_PATH=$(ls ../build/ios/ipa/*.ipa)
          APP_STORE_CONNECT_API_KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            IPA_PATH="$IPA_PATH" \
            bundle exec fastlane beta

      - name: Clean up signing material
        if: always()
        run: |
          rm -f ~/private_keys/AuthKey_*.p8
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

  finalize:
    name: Commit version bump
    needs: [prepare, release_android, release_ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Bump pubspec.yaml version
        run: dart run tool/bump_version.dart "${{ needs.prepare.outputs.version }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ needs.prepare.outputs.version }} [skip ci]"
          git push origin main
